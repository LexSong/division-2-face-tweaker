[project]
name = "face-tweaker"
version = "0.1.0"
description = "Fit The Division 2 face sliders to a target face, from recorded video"
requires-python = ">=3.14"
dependencies = [
  "mediapipe>=1.1.1",
  "numpy>=2.5.4",
  "opencv-contrib-python>=5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
force-single-line = true
