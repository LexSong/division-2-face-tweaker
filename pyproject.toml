[project]
name = "face-tweaker"
version = "0.1.0"
description = "Fit The Division 2 face sliders to a target face, from recorded video"
requires-python = ">=3.14"
dependencies = [
  "bareface",
  "mediapipe>=1.1.1",
  "numpy>=2.5.4",
  "opencv-contrib-python>=5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
force-single-line = true

# The NVIDIA library wheels behind bareface's onnxruntime-gpu cuda extra do not all ship
# for Windows, so the lock must pick versions that do.
[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
bareface = { path = "../bareface", editable = true }
